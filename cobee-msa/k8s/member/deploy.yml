apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-deployment
  labels:
    app: member-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: member-service
  template:
    metadata:
      labels:
        app: member-service
    spec:
      containers:
        - name: member-service
          image: registry.example.com/cobee/member-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: cobee-secret
          # 환경 변수를 통해 Eureka 및 Config Server 설정
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-service:8761/eureka/
            - name: SPRING_CLOUD_CONFIG_URI
              value: http://config-service:8888
          resources:
            limits:
              memory: "512Mi"
              cpu: "250m"
            requests:
              memory: "512Mi"
              cpu: "250m"
      imagePullSecrets:
        - name: registry-credential